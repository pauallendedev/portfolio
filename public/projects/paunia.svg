      <text x="14" y="28" font-family="ui-monospace" font-size="9" letter-spacing="0.2em" fill="#8a888c">XKH</text>
      <text x="14" y="58" font-family="Inter" font-size="22" font-weight="600" fill="#171618">2.450</text>
      <text x="14" y="74" font-family="Inter" font-size="11" fill="#E76851">+340 ↑</text>

      <rect x="104" y="0" width="96" height="86" rx="14" fill="#ffffff" stroke="#e9e7ea"/>
      <text x="118" y="28" font-family="ui-monospace" font-size="9" letter-spacing="0.2em" fill="#8a888c">EVENTS</text>
      <text x="118" y="58" font-family="Inter" font-size="22" font-weight="600" fill="#171618">14</text>
      <text x="118" y="74" font-family="Inter" font-size="11" fill="#8a888c">aquesta setm.</text>

      <rect x="208" y="0" width="96" height="86" rx="14" fill="#ffffff" stroke="#e9e7ea"/>
      <text x="222" y="28" font-family="ui-monospace" font-size="9" letter-spacing="0.2em" fill="#8a888c">RATXA</text>
