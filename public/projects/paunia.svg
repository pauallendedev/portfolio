<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-label="Pàunia dashboard mockup en català">
  <defs>
    <linearGradient id="paBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e0e10"/>
      <stop offset="1" stop-color="#161517"/>
    </linearGradient>
    <radialGradient id="paGlow" cx="0.18" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#E76851" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#E76851" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="paGlow2" cx="0.85" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#E76851" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#E76851" stop-opacity="0"/>
    </radialGradient>
    <pattern id="paGrid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0v56" fill="none" stroke="#1f1d20" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="paAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E76851"/>
      <stop offset="1" stop-color="#F0826B"/>
    </linearGradient>
    <linearGradient id="phoneFrame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1c1e"/>
      <stop offset="1" stop-color="#0c0c0d"/>
    </linearGradient>
    <filter id="phoneShadow" x="-20%" y="-10%" width="140%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dx="0" dy="40" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.7"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1100" fill="url(#paBg)"/>
  <rect width="1600" height="1100" fill="url(#paGrid)"/>
  <rect width="1600" height="1100" fill="url(#paGlow)"/>
  <rect width="1600" height="1100" fill="url(#paGlow2)"/>

  <!-- Side annotations -->
  <g font-family="ui-monospace, Menlo" font-size="11" letter-spacing="0.22em" fill="#5d5b5f">
    <text x="80" y="100">PÀUNIA · WEB APP PWA</text>
    <text x="80" y="120" fill="#787679">App per a parelles · català</text>
  </g>

  <g transform="translate(80, 220)" font-family="ui-monospace, Menlo" fill="#787679">
    <text x="0" y="0" font-size="10" letter-spacing="0.22em" fill="#5d5b5f">// MÒDULS</text>
    <g font-size="13" fill="#a8a6a9">
      <text x="0" y="32">01 · Núcleo + emparejament</text>
      <text x="0" y="58">02 · Calendari (RFC 5545)</text>
      <text x="0" y="84">03 · XKH · economia interna</text>
      <text x="0" y="110">04 · Botiga de recompenses</text>
    </g>
  </g>

  <g transform="translate(80, 540)" font-family="ui-monospace, Menlo" fill="#787679">
    <text x="0" y="0" font-size="10" letter-spacing="0.22em" fill="#5d5b5f">// STACK</text>
    <g font-size="12" fill="#a8a6a9">
      <text x="0" y="28">Next.js 16 · App Router</text>
      <text x="0" y="50">Supabase · Postgres · RLS</text>
      <text x="0" y="72">Serwist · service worker</text>
      <text x="0" y="94">next-intl 4 · Upstash · Resend</text>
      <text x="0" y="116">rrule · dnd-kit · date-fns-tz</text>
      <text x="0" y="138">Vitest · Playwright · axe</text>
    </g>
  </g>

  <g transform="translate(80, 880)" font-family="ui-monospace, Menlo">
    <text x="0" y="0" font-size="10" letter-spacing="0.22em" fill="#5d5b5f">// LIVE</text>
    <text x="0" y="22" font-size="12" fill="#E76851">paunia.vercel.app</text>
    <circle cx="-12" cy="18" r="3" fill="#E76851"/>
  </g>

  <!-- Right side: tag chips -->
  <g transform="translate(1240, 100)" font-family="ui-monospace" font-size="10" letter-spacing="0.18em" fill="#a8a6a9">
    <rect x="0" y="0" width="120" height="22" rx="11" fill="none" stroke="#2a282b"/>
    <text x="60" y="15" text-anchor="middle">PWA · IOS · ANDROID</text>
    <rect x="130" y="0" width="80" height="22" rx="11" fill="none" stroke="#2a282b"/>
    <text x="170" y="15" text-anchor="middle">i18n CA</text>
    <rect x="0" y="32" width="92" height="22" rx="11" fill="none" stroke="#2a282b"/>
    <text x="46" y="47" text-anchor="middle">PUSH · WEB</text>
