        <rect x="0" y="20" width="14" height="18" rx="3" fill="#E76851"/>
        <rect x="20" y="0" width="14" height="38" rx="3" fill="#fde6df"/>
        <rect x="20" y="14" width="14" height="24" rx="3" fill="#E76851"/>
        <rect x="40" y="0" width="14" height="38" rx="3" fill="#fde6df"/>
        <rect x="40" y="6" width="14" height="32" rx="3" fill="#E76851"/>
        <rect x="60" y="0" width="14" height="38" rx="3" fill="#fde6df"/>
